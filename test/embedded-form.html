<!DOCTYPE html>
<!--
  Local test fixture for the iframe-embedded ATS case. The application form lives
  in a same-origin iframe, mimicking a company page (careers.acme.com) that
  embeds a third-party ATS form.

  Serve this over http://localhost (NOT file://) so the manifest doesn't match
  and auto-inject — that's what forces the popup's "Enable on this page" +
  frame-aware fill path. From the repo root:

      python3 -m http.server 8000

  then open http://localhost:8000/test/embedded-form.html
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Careers — Embedded Application</title>
    <style>
      body { font: 15px system-ui; max-width: 700px; margin: 40px auto; }
      iframe { width: 100%; height: 900px; border: 1px solid #ccc; border-radius: 8px; }
      p { color: #555; }
    </style>
  </head>
  <body>
    <h1>Acme Corp — Careers</h1>
    <p>Apply below. (The form is served from an iframe, like a real embed.)</p>
    <iframe src="sample-form.html" title="Application form"></iframe>
  </body>
</html>
