<!doctype html><html><body><div class="ResAts"><form>
<div class="fab-FormColumn"><label class="fab-Label" for="firstName">First Name<span class="req">*</span></label><input class="fab-TextInput" id="firstName" name="firstName" type="text"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="lastName">Last Name<span class="req">*</span></label><input class="fab-TextInput" id="lastName" name="lastName" type="text"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="email">Email<span class="req">*</span></label><input class="fab-TextInput" id="email" name="email" type="email"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="phone">Phone</label><input class="fab-TextInput" id="phone" name="phone" type="tel"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="streetAddress">Street Address</label><input class="fab-TextInput" id="streetAddress" name="streetAddress" type="text"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="city">City</label><input class="fab-TextInput" id="city" name="city" type="text"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="state">State</label><select class="fab-SelectToggle" id="state" name="state"><option value="">-Select-</option><option value="CA">California</option><option value="OR">Oregon</option></select></div>
<div class="fab-FormColumn"><label class="fab-Label" for="zip">Zip Code</label><input class="fab-TextInput" id="zip" name="zip" type="text"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="linkedinUrl">LinkedIn URL</label><input class="fab-TextInput" id="linkedinUrl" name="linkedinUrl" type="text"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="desiredSalary">Desired Pay</label><input class="fab-TextInput" id="desiredSalary" name="desiredSalary" type="text"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="dateAvailable">Date Available</label><input class="fab-TextInput" id="dateAvailable" name="dateAvailable" type="text"></div>
<div class="fab-FormColumn"><label class="fab-Label" for="q1">Are you legally authorized to work in the United States?</label><select id="q1" name="q1"><option value="">-Select-</option><option>Yes</option><option>No</option></select></div>
<div class="fab-FormColumn"><label class="fab-Label" for="q2">Do you now, or will you in the future, require visa sponsorship?</label><select id="q2" name="q2"><option value="">-Select-</option><option>Yes</option><option>No</option></select></div>
</form></div></body></html>
