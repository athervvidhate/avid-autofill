<!doctype html><html><body><form class="new_job_application">
<div class="field"><label for="candidate_first_name">First name</label><input type="text" id="candidate_first_name" name="candidate[first_name]"></div>
<div class="field"><label for="candidate_last_name">Last name</label><input type="text" id="candidate_last_name" name="candidate[last_name]"></div>
<div class="field"><label for="candidate_email">Email</label><input type="email" id="candidate_email" name="candidate[email]"></div>
<div class="field"><label for="candidate_phone">Phone</label><input type="tel" id="candidate_phone" name="candidate[phone]"></div>
<div class="field"><label for="candidate_linkedin">LinkedIn</label><input type="url" id="candidate_linkedin" name="candidate[linkedin_url]"></div>
<div class="field"><input type="checkbox" id="gdpr" name="gdpr"><label for="gdpr">I accept that Teamtailor stores my personal information and I agree to the terms and privacy policy.</label></div>
</form></body></html>
