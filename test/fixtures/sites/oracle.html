<!doctype html><html><body><apply-flow-form class="apply-flow"><form>
<div class="apply-flow-block"><label for="firstName">First Name *</label><input id="firstName" type="text"></div>
<div class="apply-flow-block"><label for="lastName">Last Name *</label><input id="lastName" type="text"></div>
<div class="apply-flow-block"><label for="email">Email *</label><input id="email" type="email"></div>
<div class="apply-flow-block"><label for="phone">Phone Number *</label><input id="phone" type="tel"></div>
<div class="apply-flow-block"><label for="city">City</label><input id="city" type="text"></div>
<div class="apply-flow-block"><span id="auth-label">Are you legally authorized to work in the United States?</span>
  <div role="combobox" aria-labelledby="auth-label" aria-haspopup="listbox" aria-expanded="false" id="auth"><span class="oj-select-chosen">Select</span><input id="auth-input" aria-labelledby="auth-label" readonly></div>
  <ul role="listbox" style="display:none"><li role="option">Yes</li><li role="option">No</li></ul></div>
</form></apply-flow-form></body></html>
