<!doctype html><html><body><div class="jv-page"><form class="jv-form">
<div class="jv-form-field"><label class="jv-label" for="jv-first">First Name</label><input class="jv-input" id="jv-first" name="firstName" type="text"></div>
<div class="jv-form-field"><label class="jv-label" for="jv-last">Last Name</label><input class="jv-input" id="jv-last" name="lastName" type="text"></div>
<div class="jv-form-field"><label class="jv-label" for="jv-email">Email</label><input class="jv-input" id="jv-email" name="email" type="email"></div>
<div class="jv-form-field"><label class="jv-label" for="jv-phone">Phone</label><input class="jv-input" id="jv-phone" name="phone" type="tel"></div>
<div class="jv-form-field"><label class="jv-label" for="jv-loc">Current Location</label><input class="jv-input" id="jv-loc" name="location" type="text"></div>
<div class="jv-form-field"><label class="jv-label" for="jv-co">Current Company</label><input class="jv-input" id="jv-co" name="company" type="text"></div>
<div class="jv-form-field"><span class="jv-label">Are you legally authorized to work in this country?</span>
 <label><input type="radio" name="auth" value="yes"> Yes</label><label><input type="radio" name="auth" value="no"> No</label></div>
<div class="jv-form-field"><label class="jv-label" for="jv-how">How did you hear about us?</label><select id="jv-how" name="source"><option value="">Select one</option><option>LinkedIn</option><option>Company website</option><option>Job board</option><option>Other</option></select></div>
<div class="jv-form-field"><label class="jv-checkbox"><input type="checkbox" name="terms"><span>I have read and agree to the Terms of Use and Privacy Policy</span></label></div>
<div class="jv-form-field"><label class="jv-checkbox"><input type="checkbox" name="alerts"><span>Email me job alerts for similar roles</span></label></div>
</form></div></body></html>
