<!doctype html><html><body><form class="c-form">
<div class="c-form__row"><div class="c-form__field"><label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Jane Doe"></div></div>
<div class="c-form__row"><div class="c-form__field"><label for="email">Email</label><input id="email" name="email" type="email"></div></div>
<div class="c-form__row"><div class="c-form__field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div></div>
<div class="c-form__row"><div class="c-form__field"><label for="cover">Cover letter</label><textarea id="cover" name="cover"></textarea></div></div>
<div class="c-form__row"><div class="c-form__field"><label for="q_1">Are you eligible to work in the United States?</label><select id="q_1" name="q_1"><option value="">Select</option><option>Yes</option><option>No</option></select></div></div>
<div class="c-form__row"><div class="c-form__field"><label for="q_2">Link to your portfolio or website</label><input id="q_2" name="q_2" type="url"></div></div>
<div class="c-form__row"><label class="c-checkbox"><input type="checkbox" name="privacy"><span>I accept the privacy policy and agree to the processing of my data.</span></label></div>
</form></body></html>
