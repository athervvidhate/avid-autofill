<!doctype html>
<html lang="en">
  <body>
    <!-- Reduced from https://apply.workable.com/goglobal/j/8E35097D4B/apply/ on 2026-08-28. -->
    <form data-ui="application-form">
      <div>
        <span id="firstname_label">First name</span>
        <input id="firstname" name="firstname" aria-labelledby="firstname_label" required>
      </div>

      <div>
        <div role="combobox" aria-label="Telephone country code" aria-haspopup="listbox">
          <span>+1</span>
        </div>
        <ul role="listbox">
          <li role="option">United States +1</li>
          <li role="option">Canada +1</li>
        </ul>
        <input name="phone" type="tel">
      </div>

      <div>
        <span id="address_label">Address</span>
        <input id="address" name="address" aria-labelledby="address_label"
               value="Colorado Springs, United States of America">
      </div>
      <label><input id="city" name="city" aria-hidden="true" tabindex="-1"></label>
      <label><input id="postcode" name="postcode" aria-hidden="true" tabindex="-1"></label>
      <label><input id="country" name="country" aria-hidden="true" tabindex="-1"></label>

      <label>Notice Period <input name="CA_25140"></label>
    </form>
  </body>
</html>
