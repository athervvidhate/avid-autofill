name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the browser smoke tests
        run: npx playwright-core install --with-deps chromium
      - name: Browser smoke tests
        # Ubuntu runners block Chromium's sandbox; tracker-browser launches it directly.
        run: |
          chrome="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          printf '#!/bin/sh\nexec "%s" --no-sandbox "$@"\n' "$chrome" > "$RUNNER_TEMP/chrome"
          chmod +x "$RUNNER_TEMP/chrome"
          export AVID_BROWSER="$RUNNER_TEMP/chrome"
          node test/extension-browser.mjs
          node test/tracker-browser.mjs
          node test/resume-browser.mjs
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: .output/*.zip
