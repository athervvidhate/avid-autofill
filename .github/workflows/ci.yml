name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the browser smoke tests
        run: npx playwright-core install --with-deps chromium
      - name: Browser smoke tests
        run: |
          export AVID_BROWSER="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          node test/extension-browser.mjs
          node test/tracker-browser.mjs
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: .output/*.zip
